spring.application.name=campus-care
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/campus_care?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.jwt.secret=CampusCareDemoSecretKeyChangeThisToAtLeast32Characters!
app.jwt.expiration-ms=86400000
app.upload-dir=uploads

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
